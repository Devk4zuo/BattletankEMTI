<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Battle Tank EMTI</title>

    <link
    rel="stylesheet"
    href="style.css?v=5"
>

    <link
    rel="stylesheet"
    href="lobby.css?v=5"
>

</head>


<body>

    <main class="game-container">


        <!-- ================================================= -->
        <!-- CABEÇALHO -->
        <!-- ================================================= -->

        <header class="game-header">

            <div class="title-area">

                <h1>
                    BATTLE TANK EMTI
                </h1>

                <p>
                    Arena de Programadores
                </p>

            </div>


            <div class="status">

                <div>
                    <small>
                        JOGADOR
                    </small>

                    <strong id="playerName">
                        ALUNO
                    </strong>
                </div>


                <div>
                    <small>
                        VIDA
                    </small>

                    <strong id="lifeValue">
                        100
                    </strong>
                </div>


                <div>
                    <small>
                        MUNIÇÃO
                    </small>

                    <strong id="ammoValue">
                        ∞
                    </strong>
                </div>


                <div>
                    <small>
                        PONTOS
                    </small>

                    <strong id="scoreValue">
                        0
                    </strong>
                </div>
            </div>

        </header>



        <!-- ================================================= -->
        <!-- ARENA -->
        <!-- ================================================= -->

        <section class="arena-container">

            <canvas
                id="gameCanvas"
                width="1600"
                height="900"
            >
                Seu navegador não suporta Canvas.
            </canvas>


            <!-- ÁREA PARA MENSAGENS DO JOGO -->

            <div
                id="gameMessages"
                class="game-messages"
            ></div>

        </section>



        <!-- ================================================= -->
        <!-- CONTROLES -->
        <!-- ================================================= -->

        <footer class="controls">

            <span>
                WASD — movimentar
            </span>

            <span>
                Mouse — mirar
            </span>

            <span>
                Clique esquerdo — disparar
            </span>

            <span>
                Cor do tanque — definida no lobby
            </span>

            <span>
                H — mostrar colisões
            </span>

            <span>
                R — nova rodada
            </span>

        </footer>

        <div class="game-creator-credit">
            Criado por: Professor Kazuo
        </div>


    </main>



    <!-- ===================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================================== -->

<script src="network.js?v=5"></script>
<script src="lobby.js?v=5"></script>
<script src="music.js?v=5"></script>
<script src="game.js?v=5"></script>   
    


</body>

</html>
